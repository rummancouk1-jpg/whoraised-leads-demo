<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Offline · GG Outreach</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --fg:#0f172a; --muted:#475569; --card:#fff; --line:#d7dce4; --accent:#4338ca; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0d12; --fg:#f1f5f9; --muted:#b7c0cf; --card:#11151c; --line:#2a313d; --accent:#a5b4fc; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px; }
  h1 { font-size:1.5rem; margin:0 0 8px; }
  p { margin:0 0 20px; color:var(--muted); }
  a { display:inline-flex; align-items:center; min-height:44px; padding:0 20px; border-radius:12px; background:var(--accent); color:var(--bg); font-weight:600; text-decoration:none; }
  a:focus-visible { outline:3px solid var(--fg); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>You’re offline</h1>
  <p>GG Outreach needs a connection to show your workspace. Nothing from it is stored on this device.</p>
  <a href="/">Try again</a>
</main>
</body>
</html>
